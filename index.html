<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="nft.css">
    <title>Equilibrium NFT Card</title>
    
</head>

<body>

    <div id="card">

        
        <div id="banner">
            <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT">
        </div>

        
        <h3>Equilibrium #3429</h3>

        
        <p id="p1">
            Our Equilibrium collection promotes balance and calm.
        </p>

      
        <div id="currency">

            <div id="price">
                <img src="images/icon-ethereum.svg" alt="Ethereum">
                <span>0.041 ETH</span>
            </div>

            <div id="currency2">
                <img src="images/icon-clock.svg" alt="Clock">
                <span>3 days left</span>
            </div>

        </div>

        
        <hr>

      
        <div id="contact">

            <img src="images/image-avatar.png" alt="Jules Wyvern">

            <div id="creator-name">
                <span id="creationof">Creation of </span>
                <span id="jules">Jules Wyvern</span>
            </div>

        </div>

    </div>

</body>

</html>
